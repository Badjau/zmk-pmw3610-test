CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_PMW3610=y

# USB mouse output
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n
# The right controller is the standalone host-facing device for this test.
CONFIG_ZMK_SPLIT=n

# Detailed PMW3610 logs
CONFIG_INPUT_LOG_LEVEL_DBG=y
CONFIG_SPI_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=16384

# Delay logging so the terminal can connect after boot
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
